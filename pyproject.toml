[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud-workload-forecasting"
version = "1.0.0"
description = "Cloud workload forecasting challenge: analysis, validation, and forecasts"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
analysis = ["matplotlib>=3.8"]
dev = ["pytest>=8.0", "matplotlib>=3.8"]

[project.scripts]
cwfc-predict = "cwfc.predict:main"
cwfc-analyze = "cwfc.analyze:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
